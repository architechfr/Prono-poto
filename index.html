<style>
/* ════════════════════════════════════════════════════════════
   PRONO POTO — skin FOOT FLASH (or sur marine, police système)
   Implémentation vanilla du design Claude Design (07/06/2026)
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#050b1a; --s1:#0c1730; --s2:#14264a; --s3:#223e6b;
  --g:#e8c45c; --g2:#c99a2e; --gw:rgba(231,196,92,.2);
  --am:#FFB300; --rd:#FF1744; --tx:#eef4fd; --t2:#94abd1;
  --ink:#2a2000; --r:18px;
  --glass:rgba(15,27,52,.72); --gbord:rgba(148,178,226,.14);
  --fhead:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:#03070f}
body{background:transparent;
  color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;max-width:520px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;position:relative}
/* ── Fond "stade de nuit" plein écran (génératif, zéro image) ── */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1100px 700px at 50% -180px, rgba(232,196,92,.13), transparent 62%),
    radial-gradient(900px 600px at -10% 20%, rgba(64,110,190,.16), transparent 55%),
    radial-gradient(900px 700px at 110% 85%, rgba(201,154,46,.10), transparent 55%),
    linear-gradient(180deg,#081226 0%, #050b1a 45%, #03070f 100%)}
/* projecteurs + rond central façon pelouse, en filigrane */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:
    conic-gradient(from 168deg at 18% -6%, transparent 0deg, rgba(170,200,255,.07) 10deg, transparent 22deg),
    conic-gradient(from 172deg at 82% -6%, transparent 0deg, rgba(232,196,92,.06) 10deg, transparent 22deg),
    radial-gradient(circle 260px at 50% 46%, transparent 258px, rgba(148,178,226,.05) 259px, rgba(148,178,226,.05) 261px, transparent 262px),
    linear-gradient(rgba(148,178,226,.04), rgba(148,178,226,.04)) 50% 46% / 1200px 1px no-repeat;
}
h1,h2{font-weight:900;letter-spacing:.5px}

/* ── top bar ── */
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;position:sticky;top:0;z-index:6;
  background:linear-gradient(180deg,var(--bg) 70%, transparent)}
.brand{font-family:var(--fhead);font-size:21px;font-weight:900;color:var(--g);letter-spacing:1.5px;
  text-shadow:0 0 24px rgba(232,196,92,.35)}
.brand span{color:var(--am)}
.demo-pill{font-size:9px;font-weight:900;background:var(--am);color:#000;
  padding:3px 9px;border-radius:99px;letter-spacing:.5px}
.ff-back{font-size:11px;font-weight:800;color:var(--t2);text-decoration:none;white-space:nowrap;
  border:1px solid var(--s3);padding:6px 11px;border-radius:99px;background:rgba(20,38,74,.55);transition:.15s}
.ff-back:active{color:var(--g);border-color:var(--g)}
/* ── Mes ligues (switcher) ── */
.leagues-list{margin:0 16px}
.lg-row{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:7px;cursor:pointer;
  background:linear-gradient(165deg, rgba(22,38,72,.7), rgba(13,24,48,.66));
  border:1px solid var(--gbord);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.15s}
.lg-row.active{border-color:rgba(231,196,92,.5);background:linear-gradient(120deg, rgba(231,196,92,.16), rgba(13,24,48,.7))}
.lg-row:active{transform:scale(.985)}
.lg-ico{font-size:20px}
.lg-mid{flex:1;min-width:0}
.lg-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-code{font-size:10px;color:var(--t2);font-weight:700;letter-spacing:1px}
.lg-tag{font-size:9px;font-weight:900;background:var(--g);color:var(--ink);padding:3px 9px;border-radius:99px;letter-spacing:.5px;text-transform:uppercase}
.lg-go{color:var(--t2);font-size:18px;font-weight:800}
/* ── Jetons de boost ── */
.tokens-bar{margin:0 16px 6px;padding:11px 13px;border-radius:14px;
  background:linear-gradient(135deg, rgba(255,179,0,.12), rgba(13,24,48,.7));
  border:1px solid rgba(255,179,0,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.tk{display:flex;align-items:center;gap:8px}
.tk-ic{font-size:22px}
.tk-lbl{font-size:10px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.5px}
.tk-val{font-family:var(--fhead);font-size:20px;font-weight:900;color:var(--am);line-height:1}
.tk-val small{font-size:11px;color:var(--t2);font-weight:700}
.tk-hint{flex:1 1 100%;font-size:10.5px;color:var(--t2);font-weight:600;line-height:1.5}

/* ── main / nav ── */
.main{flex:1 1 auto;padding-bottom:104px}
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:496px;
  display:flex;background:rgba(9,17,36,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--gbord);border-radius:22px;padding:7px 6px;z-index:20;
  box-shadow:0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05)}
.navbtn{flex:1;background:none;border:none;color:var(--t2);font-family:inherit;font-size:10.5px;
  font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0 6px;border-radius:16px;transition:.18s}
.navbtn .ico{display:flex;line-height:0;transition:transform .18s}
.navbtn .ico svg{width:21px;height:21px}
.navbtn.on{color:var(--g);background:linear-gradient(180deg, rgba(232,196,92,.16), rgba(232,196,92,.05))}
.navbtn.on .ico{transform:translateY(-1px) scale(1.1);filter:drop-shadow(0 0 8px rgba(232,196,92,.6))}

/* ── primitives ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
  border:none;border-radius:15px;cursor:pointer;font-family:var(--fhead);font-size:16px;font-weight:800;
  letter-spacing:.3px;transition:transform .12s, box-shadow .12s;
  background:linear-gradient(180deg,#f4d479 0%, var(--g) 38%, var(--g2) 100%);color:var(--ink);
  box-shadow:0 6px 0 #6e5414, 0 10px 24px rgba(232,196,92,.22), inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6e5414}
.btn.alt{background:rgba(20,38,74,.7);color:var(--tx);border:1.5px solid var(--s3);box-shadow:none;backdrop-filter:blur(8px)}
.btn.alt:active{transform:scale(.98)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.card{background:linear-gradient(165deg, rgba(22,38,72,.78), var(--glass));border:1px solid var(--gbord);
  border-radius:var(--r);padding:14px;margin:0 16px 11px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05)}
.sec{font-family:var(--fhead);font-size:13.5px;font-weight:800;color:var(--g);letter-spacing:2px;text-transform:uppercase;
  margin:18px 16px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec-count{font-size:11px;font-weight:800;color:var(--t2);flex:0 0 auto;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1.5px solid var(--s3);
  background:var(--s2);color:var(--t2);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;transition:.15s}
.chip.on{background:var(--g);color:var(--ink);border-color:var(--g)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--g);transition:width .5s ease}
/* case de score tappable : appui = +1 but · appui long = −1 but */
.sbox{position:relative;width:54px;height:52px;border-radius:14px;background:rgba(29,55,96,.85);
  color:var(--am);font-family:var(--fhead);font-size:26px;font-weight:900;line-height:1;cursor:pointer;
  border:1px solid var(--s3);transition:transform .1s, background .1s, color .1s;
  display:flex;align-items:center;justify-content:center;
  text-shadow:0 0 16px rgba(255,179,0,.35);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.sbox:active{transform:scale(.92);background:var(--g);color:var(--ink);text-shadow:none}
.sbox.lng{background:var(--rd);color:#fff;transform:scale(.92);text-shadow:none}
.sbox .empty{color:var(--t2)}
.sb-dash{color:var(--t2);font-weight:900;font-size:18px}
/* scores rapides en un tap */
.m-quick{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.m-quick button{flex:1;min-width:52px;padding:8px 0;border-radius:10px;border:1px dashed var(--s3);
  background:rgba(20,38,74,.45);color:var(--t2);font-family:var(--fhead);font-weight:800;font-size:13px;
  cursor:pointer;transition:.12s;letter-spacing:1px}
.m-quick button:active{background:var(--gw);color:var(--g);border-color:var(--g);transform:scale(.95)}
.m-quick .mq-dice{flex:0 0 auto;min-width:44px;border-style:solid;color:var(--g)}
.boost{display:inline-flex;align-items:center;gap:2px;padding:7px 11px;border-radius:99px;
  border:1.5px solid var(--s3);background:var(--s2);color:var(--t2);font-family:inherit;
  font-weight:900;font-size:13px;cursor:pointer;transition:.15s}
.boost.on{background:var(--am);color:#000;border-color:var(--am);box-shadow:0 0 14px rgba(255,179,0,.45)}
.avatar{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:#081020;letter-spacing:0}

/* ── modal bottom sheet ── */
.scrim{position:fixed;inset:0;background:rgba(2,6,14,.74);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--s1);border-top-left-radius:26px;border-top-right-radius:26px;
  border-top:1px solid var(--s3);padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  animation:slideup .28s cubic-bezier(.2,.8,.25,1);max-height:90vh;overflow-y:auto}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grip{width:42px;height:5px;border-radius:99px;background:var(--s3);margin:2px auto 14px}
.sheet-title{font-size:19px;font-weight:900;color:var(--tx);margin-bottom:14px;text-align:center}
.form{display:flex;flex-direction:column;gap:9px}
.form.success{align-items:center;text-align:center}
.flabel{font-size:12px;font-weight:800;color:var(--t2);margin-top:4px}
.input{width:100%;padding:15px;background:var(--s2);border:2px solid var(--s3);border-radius:13px;
  color:var(--tx);font-size:16px;font-weight:700;font-family:inherit;outline:none;text-align:center}
.input:focus{border-color:var(--g)}
.input.code{letter-spacing:9px;text-transform:uppercase;font-size:24px;font-weight:900;color:var(--am)}
.form .btn{margin-top:8px}
.cs-emoji{font-size:48px}
.cs-title{font-size:19px;font-weight:900;margin:2px 0 6px}
.qr{background:#fff;padding:11px;border-radius:16px;display:inline-flex;line-height:0;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toastbox{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(8px);
  background:#02060e;color:#fff;padding:11px 20px;border-radius:99px;font-weight:800;font-size:13px;
  z-index:90;border:1.5px solid var(--g);opacity:0;transition:.25s;pointer-events:none;
  white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toastbox.show{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ── bannière + guide d'installation ── */
.install-banner{display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:11px 13px;border-radius:14px;cursor:pointer;
  background:linear-gradient(120deg, rgba(255,179,0,.16), rgba(13,24,48,.78));border:1px solid rgba(255,179,0,.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.install-banner:active{transform:scale(.99)}
.ib-ic{font-size:22px;flex:0 0 auto}
.ib-txt{flex:1;font-size:12.5px;color:var(--t2);line-height:1.35}
.ib-txt b{color:var(--tx)}
.ib-x{flex:0 0 auto;background:none;border:none;color:var(--t2);font-size:15px;font-weight:900;cursor:pointer;padding:4px 6px;line-height:1}
.inst-tabs{display:flex;gap:8px;margin-bottom:12px}
.inst-tab{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--s3);background:var(--s2);color:var(--t2);
  font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;transition:.15s}
.inst-tab.on{background:var(--g);color:var(--ink);border-color:var(--g)}
.inst-steps{display:flex;flex-direction:column;gap:11px}
.inst-step{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;color:var(--t2);line-height:1.45}
.inst-step b{color:var(--tx)}
.inst-n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--g);color:var(--ink);
  font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.inst-ico{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;
  border-radius:6px;background:var(--s2);border:1px solid var(--s3);color:var(--g);font-size:14px;vertical-align:-4px}

/* ── onboarding ── */
.onboard{padding:6px 0 18px}
.hero{position:relative;text-align:center;padding:26px 16px 18px;overflow:hidden;border-radius:0 0 28px 28px}
.hero.has-img{background-size:cover;background-position:center 30%;
  box-shadow:inset 0 -80px 60px -30px var(--bg), inset 0 0 0 999px rgba(5,11,26,.45)}
.hero-glow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:340px;height:340px;
  background:radial-gradient(circle, rgba(231,196,92,.34), transparent 68%);z-index:0;
  animation:heropulse 4s ease-in-out infinite}
@keyframes heropulse{0%,100%{opacity:.8}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
.mascot{font-size:72px;position:relative;z-index:1;animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 0 22px rgba(232,196,92,.5)) drop-shadow(0 8px 14px rgba(0,0,0,.4));display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.brand-big{font-family:var(--fhead);font-size:40px;font-weight:900;line-height:1;color:var(--g);position:relative;z-index:1;margin-top:6px;letter-spacing:2px;
  text-shadow:0 0 32px rgba(232,196,92,.45), 0 3px 0 rgba(0,0,0,.35)}
.brand-big span{color:var(--am)}
.tagline{color:var(--tx);font-weight:800;font-size:17px;margin-top:10px;position:relative;z-index:1;padding:0 18px}
.valueprops{margin:14px 16px 20px;display:flex;flex-direction:column;gap:10px}
.vp{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--s3);
  border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--t2)}
.vp span{font-size:24px;flex:0 0 auto}
.vp b{color:var(--tx)}
.onboard-cta{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.mini-hint{text-align:center;color:var(--t2);font-size:12px;font-weight:700;margin-top:14px;padding:0 24px}

/* ── league strip ── */
.league-strip{display:flex;align-items:center;gap:12px;margin:12px 16px 4px;padding:13px 14px;
  border-radius:var(--r);cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(120deg, rgba(231,196,92,.22), rgba(13,24,48,.75));
  border:1px solid rgba(231,196,92,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08)}
.league-strip::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.10), transparent);
  animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-80%}100%{left:130%}}
.ls-trophy{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #f4d479, var(--g2));
  box-shadow:0 4px 12px rgba(201,154,46,.4), inset 0 1px 0 rgba(255,255,255,.55)}
.ls-mid{flex:1;min-width:0}
.ls-name{font-size:17px;font-weight:900;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls-sub{font-size:11px;color:var(--t2);font-weight:700}
.ls-rank{text-align:right}
.ls-rank-pos{font-size:21px;font-weight:900;color:var(--am)}
.ls-rank-pts{font-size:11px;color:var(--t2);font-weight:800}

/* ── match rows ── */
.day{position:sticky;top:0;z-index:5;margin:16px 0 8px;padding:7px 16px;
  font-family:var(--fhead);font-size:11.5px;font-weight:800;color:var(--g);
  text-transform:uppercase;letter-spacing:1.5px;
  background:linear-gradient(180deg, rgba(5,11,26,.92) 60%, transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.match{background:linear-gradient(165deg, rgba(22,38,72,.74), rgba(13,24,48,.7));
  border:1px solid var(--gbord);border-radius:var(--r);padding:12px 13px;margin:0 16px 9px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.15s;
  box-shadow:0 6px 18px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.04)}
.match.st-played,.match.st-live,.match.st-open{cursor:pointer}
.match.st-played:active,.match.st-live:active,.match.st-open:active{transform:scale(.99);border-color:var(--g)}

function computeDemoStandings(){
  var played=ALL_MATCHES.filter(function(m){return m.score1!=null&&m.team1})
    .sort(function(a,b){return H(b.kickoff)-H(a.kickoff)}); // récent → ancien
  var tot={};
  DEMO_MEMBERS.forEach(function(u){tot[u.user_id]={pts:0,ex:0,seq:[]}});
  played.forEach(function(m){
    var preds=DEMO_MEMBERS.map(function(u,i){
      var p=(u.me&&S.pronos[m.id])?S.pronos[m.id]:genPred(i,m);
      return{user_id:u.user_id,s1:p.s1,s2:p.s2,boost:p.boost||1};
    });
    var lone=lonelyExactUid(preds,m); // bonus seul au monde +200
    preds.forEach(function(x){
      var sc=computePoints(x,m);
      if(lone===x.user_id)sc+=200;
      tot[x.user_id].pts+=sc;
      if(predOutcome(x,m)==="exact")tot[x.user_id].ex++;
      tot[x.user_id].seq.push(sc>0);
    });
  });
  return DEMO_MEMBERS.map(function(u){
    var t=tot[u.user_id],streak=0;
    for(var i=0;i<t.seq.length;i++){if(t.seq[i])streak++;else break}
    return{user_id:u.user_id,pseudo:u.pseudo,points:t.pts,played:played.length,exacts:t.ex,streak:streak,me:!!u.me};
  }).sort(function(a,b){return b.points-a.points||b.exacts-a.exacts});
}

/* ═══ Synchro pronos Prono Poto ⇄ Foot Flash (store partagé, même domaine) ═══
   Scores uniquement (les boosts restent propres à chaque app), matchs OUVERTS
   uniquement, jamais d'effacement. "Dernier modifié gagne" via horodatage. */
var PP_SYNC_KEY="ff_shared_pronos", PP_TS_KEY="ppff_pronos_ts";
function ppSyncReadShared(){try{return JSON.parse(localStorage.getItem(PP_SYNC_KEY)||"{}")||{}}catch(e){return {}}}
function ppSyncReadTs(){try{return JSON.parse(localStorage.getItem(PP_TS_KEY)||"{}")||{}}catch(e){return {}}}
function ppMatchOpen(id){ if(!S.matches)return false; var m=S.matches.find(function(x){return String(x.id)===String(id)}); return !!m && matchState(m)==="open"; }
function ppSyncPush(id){
  try{ var p=S.pronos[id]; if(!p||p.s1==null||p.s2==null)return;
    var sh=ppSyncReadShared(), t=Date.now();
    sh[String(id)]={s1:p.s1,s2:p.s2,ts:t}; localStorage.setItem(PP_SYNC_KEY,JSON.stringify(sh));
    var ts=ppSyncReadTs(); ts[String(id)]=t; localStorage.setItem(PP_TS_KEY,JSON.stringify(ts));
  }catch(e){}
}
function ppSyncPull(){
  var sh=ppSyncReadShared(), ts=ppSyncReadTs(), changed=false;
  Object.keys(sh).forEach(function(id){
    var o=sh[id]; if(!o||o.s1==null||o.s2==null)return;     // score complet uniquement
    if(!ppMatchOpen(id))return;                             // match ouvert uniquement
    if(o.ts>(ts[id]||0)){
      var p=S.pronos[id]||{boost:1};
      p.s1=Math.max(0,Math.min(20,o.s1)); p.s2=Math.max(0,Math.min(20,o.s2));
      if(p.boost==null)p.boost=1;
      S.pronos[id]=p; markDirty(id); ts[id]=o.ts; changed=true;
    }
  });
  if(changed){ try{localStorage.setItem(PP_TS_KEY,JSON.stringify(ts))}catch(e){}; save(); }
  return changed;
}
function ppSyncSeedOnce(){
  try{ if(localStorage.getItem("ppff_sync_seeded")==="1")return;
    var sh=ppSyncReadShared(), ts=ppSyncReadTs(), t0=Date.now();
    Object.keys(S.pronos||{}).forEach(function(id){ var p=S.pronos[id];
      if(p&&p.s1!=null&&p.s2!=null){ if(ts[id]==null)ts[id]=t0;
        var cur=sh[String(id)]; if(!cur||ts[id]>=cur.ts){ sh[String(id)]={s1:p.s1,s2:p.s2,ts:ts[id]}; } }
    });
    localStorage.setItem(PP_SYNC_KEY,JSON.stringify(sh));
    localStorage.setItem(PP_TS_KEY,JSON.stringify(ts));
    localStorage.setItem("ppff_sync_seeded","1");
  }catch(e){}
}
function ppSyncReconcile(){ try{ ppSyncSeedOnce(); if(ppSyncPull())render(); }catch(e){} }

function H(iso){return new Date(iso).getTime()}
function matchState(m){
  if(!m.team1||!m.team2)return "tbd";
  if(m.score1!=null&&m.score2!=null)return "played";
  if(H(m.kickoff)<=NOW())return "live";
  return "open";
}
function fmtDay(iso){var s=new Date(iso).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtH(iso){return new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function countdown(iso){var ms=H(iso)-NOW();if(ms<=0)return "maintenant";
  var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mn=Math.floor(ms%36e5/6e4);
  if(d>0)return "J-"+d+" "+h+"h";if(h>0)return "dans "+h+"h"+String(mn).padStart(2,"0");return "dans "+mn+" min"}
/* Barème "gros points" : bon résultat = 100 · score exact = 300 (×3)
   × Boost ⚡2 / Super Boost ⭐3 → jusqu'à 900 pts sur un match.
   (v2 prévue : buteur, score mi-temps... = bonus d'expérience) */
function computePoints(p,m){
  if(m.score1==null||m.score2==null)return null;
  var base=0;
  if(p.s1===m.score1&&p.s2===m.score2)base=300;
  else if(Math.sign(p.s1-p.s2)===Math.sign(m.score1-m.score2))base=100;
  return base*(p.boost||1);
}
function predOutcome(p,m){
  if(p.s1===m.score1&&p.s2===m.score2)return "exact";
  if(Math.sign(p.s1-p.s2)===Math.sign(m.score1-m.score2))return "good";
  return "miss";
}
var AV_COLORS=["#e8c45c","#FFB300","#ff7a59","#7c5cff","#00c2ff","#ff4d6a","#36d6c3","#21d07a"];
function avColor(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return AV_COLORS[h%AV_COLORS.length]}
function avatar(name,size,ring){

}
function qrSvg(text,size){

      r+='<rect x="'+(j*cell).toFixed(2)+'" y="'+(i*cell).toFixed(2)+'" width="'+cell.toFixed(2)+'" height="'+cell.toFixed(2)+'" rx="'+(cell*0.32).toFixed(2)+'"/>';
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" fill="#060d1f">'+r+'</svg>';
  }catch(e){return ''}

function fireConfetti(){
  var cv=$("confetti"),ctx=cv.getContext("2d");
  var W=cv.width=cv.offsetWidth,Hh=cv.height=cv.offsetHeight;
  var COLORS=["#e8c45c","#FFB300","#ff7a59","#7c5cff","#00c2ff","#ff4d6a"];
  var parts=[];for(var i=0;i<90;i++)parts.push({x:W/2+(Math.random()-0.5)*60,y:Hh*0.32,
    vx:(Math.random()-0.5)*9,vy:-(Math.random()*11+5),g:0.32+Math.random()*0.12,s:5+Math.random()*6,
    rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,c:COLORS[(Math.random()*COLORS.length)|0],life:0});
  var t=0;(function tick(){
    ctx.clearRect(0,0,W,Hh);t++;
    parts.forEach(function(p){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,1-p.life/110);ctx.fillStyle=p.c;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore()});
    if(t<120)requestAnimationFrame(tick);else ctx.clearRect(0,0,W,Hh);
  })();
}

function setScore(id,side,delta){
  var m=S.matches.find(function(x){return x.id===id});
  if(matchState(m)!=="open"){toast("🔒 Match verrouillé");return}
  var p=S.pronos[id]||{s1:0,s2:0,boost:1};
  p[side]=Math.max(0,Math.min(20,(p[side]||0)+delta));
  S.pronos[id]=p;markDirty(id);save();ppSyncPush(id);render();
}
/* ── Case de score : appui = +1 but · appui long (≈420ms) = −1 but.
   Un seul geste par case → fini les deux boutons −/+ trop gros. ── */
var _sbTimer=null,_sbLong=false;
function scoreDown(ev,id,side){
  ev.stopPropagation();
  _sbLong=false;
  var el=ev.currentTarget;
  _sbTimer=setTimeout(function(){
    _sbLong=true;
    if(el)el.classList.add("lng");
    if(navigator.vibrate)navigator.vibrate(18);
    setScore(id,side,-1); // re-render : la case courante disparaît, c'est voulu
  },420);
}
function scoreUp(ev,id,side){
  ev.stopPropagation();
  clearTimeout(_sbTimer);
  if(_sbLong){_sbLong=false;return} // l'appui long a déjà retiré un but
  setScore(id,side,1);
  if(!localStorage.getItem("ppff_hint_longpress")){
    localStorage.setItem("ppff_hint_longpress","1");
    toast("💡 Astuce : appui long sur le score = enlever un but");
  }
}
function scoreCancel(ev){
  if(ev)ev.stopPropagation();
  clearTimeout(_sbTimer);_sbLong=false;

/* ── CAPITAINE / SUPER CAPITAINE — mécanique à rareté (façon Kicktipp/fantasy)
   ⚡ Boost ×2 : UN seul par journée (J1/J2/J3 des groupes, puis par tour KO)
   ⭐ Super Boost ×3 : UN seul par phase (groupes / phase finale)
   → fini le boost illimité qui ne valait rien. ── */
function journeyKey(m){
  var b=stageBucket(m.stage);
  if(b!=="Groupes")return b; // chaque tour KO = sa propre "journée"
  var grp=S.matches.filter(function(x){return x.stage===m.stage})
    .sort(function(a,c){return H(a.kickoff)-H(c.kickoff)||a.id-c.id});
  for(var i=0;i<grp.length;i++)if(grp[i].id===m.id)return "J"+(Math.floor(i/2)+1);
  return "J?";
}
function journeyLabel(k){return k.indexOf("J")===0?("Journée "+k.slice(1)):k}
function superPhase(m){return stageBucket(m.stage)==="Groupes"?"groupes":"phase finale"}
/* ─── JETONS DE BOOST (v2) ─────────────────────────────────────
   50 jetons par phase (groupes / phase finale). Placer un boost
   coûte des jetons : ⚡×2 = 5, ⭐×3 = 15. On REGAGNE des jetons en
   jouant : +2 par bon résultat, +5 par score exact (matchs joués).
   Solde phase = 50 + gains − coûts engagés. */
var BOOST_COST={2:5,3:15};
var TOKENS_BASE=50;
function phaseTokens(phase){
  var gain=0,spent=0;
  S.matches.forEach(function(m){
    if(superPhase(m)!==phase)return;
    var p=S.pronos[m.id];if(!p)return;
    if((p.boost||1)>1)spent+=BOOST_COST[p.boost]||0;
    if(m.score1!=null&&m.score2!=null){
      var o=predOutcome(p,m);
      if(o==="exact")gain+=5;else if(o==="good")gain+=2;
    }
  });
  return {base:TOKENS_BASE,gain:gain,spent:spent,solde:TOKENS_BASE+gain-spent};
}
function cycleBoost(id){
  var m=S.matches.find(function(x){return x.id===id});
  if(matchState(m)!=="open"){toast("🔒 Match verrouillé");return}
  var p=S.pronos[id];
  if(!p){toast("Saisis d'abord un score");return}
  var cur=p.boost||1,next=cur===1?2:cur===2?3:1;
  if(next>1){
    var t=phaseTokens(superPhase(m));
    var dispo=t.solde+(BOOST_COST[cur]||0); // on récupère le coût du boost actuel qu'on remplace
    var cost=BOOST_COST[next]||0;
    if(dispo<cost){
      toast("💰 Pas assez de jetons "+(superPhase(m)==="groupes"?"(poules)":"(finale)")+" : "+dispo+" dispo, "+cost+" requis");
      return;
    }
  }
  p.boost=next;markDirty(id);save();render();
  var solde=phaseTokens(superPhase(m)).solde;
  if(next===2)toast("⚡ Boost ×2 placé (−5 jetons) · reste "+solde);
  else if(next===3)toast("⭐ Super Boost ×3 placé (−15 jetons) · reste "+solde);
  else toast("Boost retiré · +"+( (BOOST_COST[cur]||0) )+" jetons rendus");
}
/* Bonus "Seul au monde" : +200 pts si tu es le SEUL de la ligue avec le score exact */
function lonelyExactUid(preds,m){
  if(m.score1==null)return null;
  var ex=preds.filter(function(f){return predOutcome(f,m)==="exact"});
  return ex.length===1?ex[0].user_id:null;
}

/* Message d'invitation taillé pour WhatsApp : le lien embarque le code,
   donc un seul tap = app ouverte + ligue rejointe. */
function inviteMessage(){
  var nm=S.league?S.league.name:"ma ligue", code=S.league?S.league.code:"";
  return "🏆 Rejoins ma ligue « "+nm+" » sur Prono Poto !\n"
    +"On se défie aux pronos de la Coupe du Monde 2026 ⚽\n\n"
    +"👉 Tape le lien : ça t'ajoute direct dans la ligue (code "+code+").\n"
    +"📲 Ajoute-la à ton écran d'accueil pour jouer en plein écran, comme une vraie appli.\n\n"
    +inviteLink();
}
function copyLink(){
  var msg=inviteMessage();
  if(navigator.clipboard)navigator.clipboard.writeText(msg);
  toast("📋 Invitation copiée — colle-la dans WhatsApp !");
}
function shareLink(){
  if(navigator.share)navigator.share({title:"Prono Poto",text:inviteMessage()}).catch(function(){});
  else copyLink();
}
/* ── Installation plein écran (PWA) ── */
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)}
function dismissInstall(){try{localStorage.setItem("ppff_install_dismiss","1")}catch(e){}; var b=$("installBanner"); if(b)b.remove();}
function installBannerHtml(){
  if(isStandalone())return "";
  try{if(localStorage.getItem("ppff_install_dismiss"))return ""}catch(e){}
  return '<div id="installBanner" class="install-banner" onclick="openModal(\'install\')">'
    +'<span class="ib-ic">📲</span>'
    +'<span class="ib-txt"><b>Installe Prono Poto</b> en plein écran sur ton téléphone</span>'
    +'<button class="ib-x" onclick="event.stopPropagation();dismissInstall()" aria-label="Fermer">✕</button></div>';
}
function leaveLeague(){
  if(!confirm("Quitter « "+(S.league?S.league.name:"")+" » sur cet appareil ? (tes pronos publiés restent au classement)"))return;
  var k=_leagueKey(S.league);
  S.leagues=(S.leagues||[]).filter(function(x){return _leagueKey(x)!==k});
  if(S.leagues.length){
    S.league=S.leagues[0];save();
    toast("🏆 Ligue active : "+S.league.name);
    go("ligue");loadStandings().then(render);
  }else{
    S.league=null;save();go("onboard");
  }
}
async function openDetail(id){
  S.detail=id;render();
  await loadFriendPreds(id);render();
}
// Remet tous les Boost ⚡/⭐ à ×1 (utile après un import Foot Flash)
function clearAllBoosts(){
  var n=0;
  Object.keys(S.pronos||{}).forEach(function(k){
    var p=S.pronos[k];
    if(p&&(p.boost||1)>1){p.boost=1;if(S.dirty.indexOf(k)<0)S.dirty.push(k);n++}
  });
  if(!n){toast("Aucun boost à retirer");return}
  save();render();
  toast("✨ "+n+" boost(s) retiré(s) — replace-les comme tu veux puis publie");
}
function countBoosts(){
  return Object.keys(S.pronos||{}).filter(function(k){return (S.pronos[k].boost||1)>1}).length;
}

function scoreBox(id,side,val){
  return '<button class="sbox" oncontextmenu="return false"'
    +' title="Appui = +1 but · appui long = −1 but"'
    +' onpointerdown="scoreDown(event,'+id+',\''+side+'\')"'
    +' onpointerup="scoreUp(event,'+id+',\''+side+'\')"'
    +' onpointerleave="scoreCancel(event)" onpointercancel="scoreCancel(event)">'
    +(val==null?'<span class="empty">–</span>':val)+'</button>';
}
function matchRowHtml(m){
  var st=matchState(m),p=S.pronos[m.id];
  if(st==="tbd"){
    return '<div class="match tbd"><div class="m-head"><span>'+fmtH(m.kickoff)+' · '+esc(m.stadium||"")+'</span>'
      +'<span class="m-tag">'+esc(m.stage)+'</span></div>'
      +'<div class="m-tbd">⏳ Équipes à déterminer — pronos ouverts après qualification</div></div>';
  }
  var locked=(st!=="open");
  var pts=(st==="played"&&p)?computePoints(p,m):null;
  var out=(st==="played"&&p)?predOutcome(p,m):null;
  var badge=st==="played"?'<span class="m-real">Réel '+m.score1+'–'+m.score2+'</span>'
    :st==="live"?'<span class="m-live"><i></i>EN DIRECT</span>'
    :'<span class="m-tag">'+countdown(m.kickoff)+'</span>';
  var h='<div class="match st-'+st+'" onclick="openDetail('+m.id+')">';
  h+='<div class="m-head"><span>'+fmtH(m.kickoff)+' · '+esc(m.stadium||"")+'</span>'+badge+'</div>';
  h+='<div class="m-row">';
  h+='<div class="m-team"><span class="fl">'+flag(m.team1)+'</span>'+m.team1+'</div>';
  if(locked){
    h+='<div class="m-score-locked">'+(p?('<b>'+p.s1+'</b><span>-</span><b>'+p.s2+'</b>'):'<span class="m-noprono">– pas de prono –</span>')+'</div>';
  }else{
    h+='<div class="m-steppers" onclick="event.stopPropagation()">';
    h+=scoreBox(m.id,'s1',p?p.s1:null);
    h+='<span class="sb-dash">-</span>';
    h+=scoreBox(m.id,'s2',p?p.s2:null);
    h+='</div>';
  }
  h+='<div class="m-team right">'+m.team2+'<span class="fl">'+flag(m.team2)+'</span></div></div>';
  // Scores rapides : un tap pour pronostiquer (affiché tant que pas de prono)
  if(!locked&&!p){
    h+='<div class="m-quick" onclick="event.stopPropagation()">';
    [[1,0],[1,1],[2,1],[0,1]].forEach(function(q){
      h+='<button onclick="setQuick('+m.id+','+q[0]+','+q[1]+')">'+q[0]+'–'+q[1]+'</button>';
    });
    h+='<button class="mq-dice" title="Prono suggéré (moteur Foot Flash)" onclick="setSuggested('+m.id+')">🎲</button>';
    h+='</div>';
  }
  h+='<div class="m-foot"><div class="m-foot-left">';
  if(locked&&p&&(p.boost||1)>1)h+='<span class="m-boost-lock">'+(p.boost===3?"⭐":"⚡")+'×'+p.boost+'</span>';
  if(!locked){
    var bb=(p&&p.boost)||1;
    h+='<span onclick="event.stopPropagation()"><button class="boost'+(bb>1?" on":"")+'" title="⚡ Boost ×2 (1 par journée) · ⭐ Super Boost ×3 (1 par phase)" onclick="cycleBoost('+m.id+')">'
      +(bb===3?'⭐<b>×3</b>':bb===2?'⚡<b>×2</b>':'⚡')+'</button></span>';
  }
  h+='<span class="m-detail-link">'+(locked?"Voir les pronos des potos ›":"Détails du match ›")+'</span>';
  h+='</div>';
  if(pts!=null)h+='<span class="m-pts '+out+'">'+(out==="exact"?"🎯 ":"")+(pts>0?"+":"")+pts+' pts</span>';
  h+='</div></div>';
  return h;
}
function publishDockHtml(){
  if(!S.dirty.length)return "";
  return '<div class="publish-dock"><button class="btn" onclick="publishPronos()">📤 Publier mes pronos '
    +'<span class="pub-count">'+S.dirty.length+'</span></button></div>';
}
function vPronos(){
  var me=S.standings.find(function(x){return x.me});
  var meIdx=S.standings.indexOf(me);
  var h='<div class="league-strip" onclick="go(\'ligue\')">'
   +'<div class="ls-trophy">🏆</div><div class="ls-mid">'
   +'<div class="ls-name">'+esc(S.league.name)+'</div>'
   +'<div class="ls-sub">'+(S.members||"–")+' potos · code '+esc(S.league.code)+((S.leagues||[]).length>1?' · '+S.leagues.length+' ligues':'')+'</div></div>'
   +'<div class="ls-rank"><div class="ls-rank-pos">'+(meIdx===0?"🥇":meIdx===1?"🥈":meIdx===2?"🥉":meIdx>=0?("#"+(meIdx+1)):"–")+'</div>'
   +'<div class="ls-rank-pts">'+(me?me.points:0)+' pts</div></div></div>';
  h+='<div class="sec"><span>📝 Mes pronos</span>'
   +'<span class="sec-count" style="cursor:pointer;color:var(--g)" onclick="importFromFootFlash()">📥 Importer de Foot Flash</span></div>';
  // Solde de jetons de boost (par phase)
  var tg=phaseTokens("groupes"), tf=phaseTokens("phase finale");
  h+='<div class="tokens-bar">';
  h+='<div class="tk"><span class="tk-ic">🪙</span><div><div class="tk-lbl">Jetons poules</div><div class="tk-val">'+tg.solde+'<small>/'+(tg.base+tg.gain)+'</small></div></div></div>';
  h+='<div class="tk"><span class="tk-ic">🪙</span><div><div class="tk-lbl">Jetons finale</div><div class="tk-val">'+tf.solde+'<small>/'+(tf.base+tf.gain)+'</small></div></div></div>';
  h+='<div class="tk-hint">⚡×2 = 5 · ⭐×3 = 15 · tu en regagnes en gagnant'+(countBoosts()>0?' · <span style="cursor:pointer;color:var(--g);text-decoration:underline" onclick="clearAllBoosts()">remettre à zéro</span>':'')+'</div>';
  h+='</div>';
  h+='<div class="chips">'+STAGES.map(function(s){
    return '<button class="chip'+(s===S.phase?" on":"")+'" onclick="S.phase=\''+s+'\';render()">'+s+'</button>'}).join("")+'</div>';
  var visible=S.matches.filter(function(m){return S.phase==="Tout"||stageBucket(m.stage)===S.phase});
  var lastDay="";
  visible.forEach(function(m){
    var day=(m.team1?fmtDay(m.kickoff):m.stage);
    if(day!==lastDay){h+='<div class="day">'+esc(day)+'</div>';lastDay=day}
    h+=matchRowHtml(m);
  });
  if(!visible.length)h+='<div class="card" style="text-align:center;color:var(--t2)">Aucun match dans cette phase.</div>';
  h+=publishDockHtml();
  return h;
}
function vDetail(){
  var m=S.matches.find(function(x){return x.id===S.detail});
  if(!m)return vPronos();
  var st=matchState(m),p=S.pronos[m.id];
  var h='<button class="back" onclick="S.detail=null;render()">‹ Retour</button>';
  h+='<div class="scoreboard st-'+st+'">';
  h+='<div class="sb-stage">'+esc(m.stage)+' · '+fmtDay(m.kickoff)+' · '+fmtH(m.kickoff)+'</div>';
  h+='<div class="sb-main">';
  h+='<div class="sb-team"><div class="sb-fl">'+flag(m.team1,56)+'</div><div class="sb-nm">'+esc(teamName(m.team1))+'</div></div>';
  h+='<div class="sb-score">'+(st==="played"?('<b>'+m.score1+'</b><span>:</span><b>'+m.score2+'</b>')
    :st==="live"?'<b>·</b><span class="sb-live-dot">:</span><b>·</b>'
    :'<span class="sb-vs">VS</span>')+'</div>';
  h+='<div class="sb-team"><div class="sb-fl">'+flag(m.team2,56)+'</div><div class="sb-nm">'+esc(teamName(m.team2))+'</div></div>';
  h+='</div><div class="sb-status">';
  if(st==="played")h+='<span class="sb-final">⏱️ Terminé</span>';
  else if(st==="live")h+='<span class="sb-livebadge"><i></i>EN DIRECT · '+esc(m.stadium||"")+'</span>';
  else h+='<span class="sb-open">🔒 Coup d\'envoi '+countdown(m.kickoff)+'</span>';
  h+='</div></div>';
  // ── Avant-match : probabilités 1/N/2 (moteur Foot Flash) ──
  if(m.team1&&m.team2){
    var pb=outcomeProbs(m.team1,m.team2);
    var conf=Math.max(pb.home,pb.draw,pb.away);
    var tier=confidenceTier(conf);
    var fav=pb.home>=pb.away?m.team1:m.team2;
    h+='<div class="sec"><span>📊 Avant-match</span><span class="sec-count">FIFA #'+(FIFA_RANK[m.team1]||"–")+' vs #'+(FIFA_RANK[m.team2]||"–")+'</span></div>';
    h+='<div class="card prematch">';
    h+='<div class="pm-row"><span class="pm-lbl">'+m.team1+'</span>';
    h+='<div class="pm-track"><div class="pm-seg h" style="width:'+pb.home+'%"></div><div class="pm-seg d" style="width:'+pb.draw+'%"></div><div class="pm-seg a" style="width:'+pb.away+'%"></div></div>';
    h+='<span class="pm-lbl r">'+m.team2+'</span></div>';
    h+='<div class="pm-pcts"><span class="ph">'+pb.home+'% victoire</span><span class="pd">'+pb.draw+'% nul</span><span class="pa">'+pb.away+'% victoire</span></div>';
    h+='<div class="pm-meta"><span>Favori : <b style="color:var(--tx)">'+esc(teamName(fav))+'</b></span>';
    h+='<span class="pm-tier">'+tier.icon+' '+tier.label+'</span></div>';
    if(st==="open"){
      var sg=suggestedScore(m.team1,m.team2);
      h+='<div class="pm-suggest"><button class="btn alt" onclick="applySuggestion('+m.id+')">🎲 Utiliser le prono suggéré ('+sg.s1+'-'+sg.s2+')</button></div>';
    }
    h+='</div>';
  }
  if(p){
    h+='<div class="card mypred"><div class="mp-left"><span class="mp-label">TON PRONO</span>'
     +'<div class="mp-score">'+p.s1+'–'+p.s2+((p.boost||1)>1?'<span class="mp-boost">⚡×'+p.boost+'</span>':'')+'</div></div>';
    if(st==="played"){
      var out=predOutcome(p,m),pts=computePoints(p,m);
      h+='<div class="mp-pts '+out+'">'+(out==="exact"?"🎯 Score exact !":out==="good"?"✅ Bon résultat":"❌ Raté")
        +'<b>'+(pts>0?"+":"")+pts+' pts</b></div>';
    }else{
      h+='<div class="mp-pending">⏳ En attente du résultat</div>';
    }
    h+='</div>';
  }
  if(st==="open"){
    h+='<div class="locked-box"><div class="lb-lock">🔒</div><div class="lb-title">Pronos verrouillés</div>'
     +'<div class="lb-sub">Les pronos de la ligue se dévoilent au coup d\'envoi — '+countdown(m.kickoff)+'. Pas d\'espionnage !</div></div>';
  }else{
    var friends=(S.friendPreds[m.id]||[]).slice().sort(function(a,b){
      var pa=computePoints(a,m),pb=computePoints(b,m);
      return (pb==null?-1:pb)-(pa==null?-1:pa)});
    h+='<div class="sec"><span>👥 Pronos de la ligue</span><span class="sec-count">'+friends.length+' potos</span></div>';
    h+='<div class="friendlist">';
    if(!friends.length)h+='<div class="card" style="text-align:center;color:var(--t2)">Chargement…</div>';
    var lone=st==="played"?lonelyExactUid(friends,m):null;
    friends.forEach(function(f){
      var out=st==="played"?predOutcome(f,m):null;
      var pts=st==="played"?computePoints(f,m):null;
      var isLone=(lone&&lone===f.user_id);
      if(isLone&&pts!=null)pts+=200;
      h+='<div class="friend'+(f.me?" me":"")+'">'+avatar(f.pseudo,38,f.me?"var(--g)":null)
       +'<div class="fr-mid"><div class="fr-name">'+esc(f.pseudo)+(f.me?'<span class="fr-you">toi</span>':'')+'</div>'
       +'<div class="fr-dot '+(out||"")+'">'+(isLone?"🎯 seul au monde ! (+200)":out==="exact"?"score exact":out==="good"?"bon résultat":out==="miss"?"raté":"en jeu")+'</div></div>'
       +'<div class="fr-pred">'+f.s1+'-'+f.s2+((f.boost||1)>1?'<span class="fr-boost">'+(f.boost===3?"⭐":"⚡")+'×'+f.boost+'</span>':'')+'</div>'
       +'<div class="fr-pts '+(out||"pending")+'">'+(pts!=null?((pts>0?"+":"")+pts):"—")+'</div></div>';
    });
    h+='</div>';
  }
  h+='<div class="legend">Barème : bon résultat <b>100</b> · score exact <b>300</b> · ⚡ Boost ×2 (5🪙) · ⭐ Super Boost ×3 (15🪙) · 🎯 seul au monde +200</div>';
  return h;
}
function vClassement(){
  var leader=(S.standings[0]&&S.standings[0].points)||1;
  var h='<div class="sec"><span>🏆 '+esc(S.league.name)+'</span><span class="sec-count">'+(S.members||S.standings.length)+' potos</span></div>';
  if(!S.standings.length){
    h+='<div class="card" style="text-align:center;color:var(--t2)">Le classement se remplit quand les résultats tombent.</div>';
    return h;
  }
  var top3=S.standings.slice(0,3);
  var order=[top3[1],top3[0],top3[2]].filter(Boolean);
  h+='<div class="podium">';
  order.forEach(function(r){
    var place=S.standings.indexOf(r)+1;
    h+='<div class="pod pod-'+place+'"><div class="pod-medal">'+(place===1?"🥇":place===2?"🥈":"🥉")+'</div>'
     +avatar(r.pseudo,place===1?64:52,r.me?"var(--g)":"rgba(255,255,255,.15)")

     +'<div class="pod-pts">'+r.points+'</div>'
     +'<div class="pod-stand"><span>'+place+'</span></div></div>';
  });

  S.standings.slice(3).forEach(function(r,i){
    h+='<div class="rank'+(r.me?" me":"")+'"><span class="rk-pos">'+(i+4)+'</span>'
     +avatar(r.pseudo,34,r.me?"var(--g)":null)

     +(r.streak>=3?' · <span class="rk-fire">🔥 '+r.streak+'</span>':'')+'</div>'

  });
  h+='</div>';
  h+='<div style="height:8px"></div><div class="card" style="text-align:center"><button class="btn alt" onclick="refresh()">🔄 Actualiser</button></div>';
  h+=publishDockHtml();
  return h;
}

/* ─── Scanner QR intégré (BarcodeDetector + caméra) ────────── */
var _qrStream=null,_qrTimer=null;
function _qrStop(){
  if(_qrTimer){clearInterval(_qrTimer);_qrTimer=null}
  if(_qrStream){try{_qrStream.getTracks().forEach(function(t){t.stop()})}catch(e){}_qrStream=null}
}
async function scanQR(){
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices){
    toast("📷 Scanner non supporté ici — flashe le QR avec l'appareil photo du téléphone");
    return;
  }
  S.modal="qrscan";renderModal();
  try{
    _qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    var v=$("qrVideo");if(!v){_qrStop();return}
    v.srcObject=_qrStream;await v.play();
    var det=new BarcodeDetector({formats:["qr_code"]});
    _qrTimer=setInterval(async function(){
      try{
        var codes=await det.detect(v);
        if(!codes.length)return;
        var raw=codes[0].rawValue||"";
        var m=raw.match(/[?&]ligue=([A-Za-z0-9]{4,8})/);
        var code=m?m[1].toUpperCase():(/^[A-Za-z0-9]{6}$/.test(raw.trim())?raw.trim().toUpperCase():null);
        if(code){
          _qrStop();
          S.modal="join";renderModal();
          setTimeout(function(){var i=$("inCode");if(i)i.value=code},60);
          toast("✓ Code détecté : "+code);
          if(navigator.vibrate)navigator.vibrate(60);
        }
      }catch(e){}
    },350);
  }catch(e){
    closeModal();
    toast("⚠️ Caméra indisponible — flashe le QR avec l'appareil photo");
  }
}

async function doCreate(){
  var name=$("inName").value.trim(),ps=$("inPseudo").value.trim();
  if(name.length<2){toast("Nom de ligue trop court");return}
  if(ps.length<2){toast("Pseudo trop court");return}
  S.pseudo=ps;save();
  try{await ensureAuth();await apiCreateLeague(name);save();S.modal="created";renderModal();fireConfetti();}
  catch(e){toast("⚠️ "+(e.message||e))}
}
async function doJoin(){
  var ps=$("inPseudo").value.trim(),code=$("inCode").value.trim();
  if(ps.length<2){toast("Pseudo trop court");return}
  if(code.length!==6){toast("Code à 6 caractères");return}
  S.pseudo=ps;save();
  try{await ensureAuth();await apiJoinLeague(code);save();closeModal();
    await boot();go("pronos");fireConfetti();
    toast("🎉 Bienvenue dans « "+S.league.name+" » !");
    if(_ffPending())setTimeout(ffApplyPending,900);}
  catch(e){toast("⚠️ "+(e.message||e))}
}
async function enterLeague(){closeModal();await boot();go("pronos");toast("🎉 Bienvenue dans « "+S.league.name+" » !");if(_ffPending())setTimeout(ffApplyPending,900)}

function go(v){S.view=v;S.detail=null;render();scrollTo(0,0)}
// Image héro optionnelle (ex. générée par IA) : déposer assets/hero.jpg — détectée automatiquement
var HERO_IMG="assets/hero.jpg", _heroOk=null;
function tryHeroImg(){
  if(_heroOk===false)return;
  var el=document.querySelector(".hero");
  if(!el)return;
  if(_heroOk===true){el.classList.add("has-img");el.style.backgroundImage="url("+HERO_IMG+")";return}
  var im=new Image();
  im.onload=function(){_heroOk=true;tryHeroImg()};
  im.onerror=function(){_heroOk=false};
  im.src=HERO_IMG;
}
function render(){
  $("modePill").innerHTML=DEMO?'<span class="demo-pill" title="Date simulée pour montrer matchs joués / en direct / à venir">MODE DÉMO · 22 JUIN SIMULÉ</span>':"";
  var nav=$("nav");
  if(!S.league||S.view==="onboard"){nav.style.display="none";$("app").innerHTML=vOnboard();tryHeroImg();return}
  nav.style.display=S.detail?"none":"flex";
  ["pronos","classement","ligue"].forEach(function(v){
    $("nav-"+v).classList.toggle("on",S.view===v)});
  $("app").innerHTML=S.detail?vDetail():S.view==="classement"?vClassement():S.view==="ligue"?vLigue():vPronos();
}
async function refresh(){await loadMatches();await loadStandings();render();toast("🔄 À jour")}

/* ─── Import des pronos Foot Flash ─────────────────────────────
   Même domaine (architechfr.github.io) : lecture directe du
   localStorage "ff26_pronos" ({id:{a,b}}). Depuis l'APK (storage
   séparé) : lien ?ffimport=<base64> généré par Foot Flash.
   Les IDs de matchs sont identiques dans les deux apps. */
function ffImportApply(data){
  var n=0,locked=0;
  Object.keys(data).forEach(function(k){
    var id=+k;
    var m=S.matches.find(function(x){return x.id===id});
    if(!m||!m.team1||!m.team2)return;
    if(matchState(m)!=="open"){locked++;return}
    var v=data[k];
    if(!v||v.a==null||v.b==null)return;
    var p=S.pronos[id]||{boost:1};
    p.s1=Math.max(0,Math.min(20,+v.a||0));
    p.s2=Math.max(0,Math.min(20,+v.b||0));
    p.boost=1; // les boosts Foot Flash ne s'appliquent pas ici (règles différentes) — à replacer dans Prono Poto
    S.pronos[id]=p;markDirty(id);if(typeof ppSyncPush==="function")ppSyncPush(id);n++;
  });
  if(n)save();
  render();
  toast(n?("📥 "+n+" pronos Foot Flash importés"+(locked?" · "+locked+" verrouillés ignorés":"")+" — pense à 📤 Publier !")
         :"Aucun prono importable (matchs verrouillés ?)");
}
function _ffPending(){try{return JSON.parse(localStorage.getItem("ppff_ffimport")||"null")}catch(e){return null}}
function ffApplyPending(){
  var d=_ffPending();
  closeModal();
  if(!d){toast("Rien à importer");return}
  try{localStorage.removeItem("ppff_ffimport")}catch(e){}
  ffImportApply(d);
}
function importFromFootFlash(){
  var data=null;
  // 1) lien d'import en attente (venu de l'APK)
  try{var pend=localStorage.getItem("ppff_ffimport");if(pend){data=JSON.parse(pend);localStorage.removeItem("ppff_ffimport")}}catch(e){}
  // 2) sinon : pronos Foot Flash web (même domaine)
  if(!data){try{data=JSON.parse(localStorage.getItem("ff26_pronos")||"null")}catch(e){}}
  if(!data||!Object.keys(data).length){toast("Aucun prono Foot Flash sur cet appareil");return}
  var conflicts=Object.keys(data).filter(function(k){return S.pronos[+k]&&S.pronos[+k].s1!=null}).length;
  if(conflicts&&!confirm("Écraser "+conflicts+" prono(s) déjà saisi(s) dans Prono Poto ?"))return;
  ffImportApply(data);
}
async function boot(){
  await loadMatches();
  // Démo : seed des pronos fictifs au premier lancement (matchs verrouillés + 3 à publier)
  if(DEMO&&!Object.keys(S.pronos).length){
    var g=genMyPronos();S.pronos=g.pronos;S.dirty=g.dirty;save();
  }
  if(S.league){try{await ensureAuth()}catch(e){}await loadStandings()}
}
(async function init(){
  await boot();
  // Synchro avec Foot Flash : on récupère les scores édités là-bas (et on publie les nôtres)
  try{ ppSyncSeedOnce(); ppSyncPull();
    window.addEventListener("storage", function(e){ if(e&&e.key===PP_SYNC_KEY) ppSyncReconcile(); });
    window.addEventListener("focus", ppSyncReconcile);
  }catch(e){}
  var qs=new URLSearchParams(location.search);
  // Lien d'import Foot Flash (?ffimport=base64) — depuis l'APK ou un autre appareil
  var ffi=qs.get("ffimport"),ffiOk=false;
  if(ffi){
    try{
      var data=JSON.parse(atob(decodeURIComponent(ffi)));
      localStorage.setItem("ppff_ffimport",JSON.stringify(data));
      ffiOk=true;
    }catch(e){toast("⚠️ Lien d'import invalide")}
    history.replaceState(null,"",location.pathname);
  }
  var urlCode=qs.get("ligue");
  if(!S.league&&urlCode){S.view="onboard";render();openModal("join");}
  else{S.view=S.league?"pronos":"onboard";render();}
  // Pronos Foot Flash reçus : si l'utilisateur est DÉJÀ dans une ligue,
  // application directe (pas de question inutile) ; sinon choix de la ligue.
  if(ffiOk){
    if(S.league){ ffApplyPending(); }
    else openModal("ffimport");
  }
})();
</script>
